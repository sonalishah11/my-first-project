name: Selenium Automation Test

on:
  push:
    branches: [ "master", "main" ] # यह दोनों ब्रांच पर काम करेगा

jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps:
    - name: Get Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Selenium Tests
      run: mvn clean test
